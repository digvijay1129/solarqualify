name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend test suite
        env:
          NODE_ENV: test
          PORT: "5000"
          MONGODB_URI: mongodb://127.0.0.1:27017/solarqualify_test
          JWT_SECRET: solarqualify-test-only-jwt-secret-not-for-production-2026
          JWT_EXPIRES_IN: 1h
          MAX_UPLOAD_MB: "5"
          DOCUMENT_ENCRYPTION_KEY: NLMKLKbR+z0pVuAgiReT6p7kBBpkEadYpVwe2h/7LaE=
        run: npm run test:server
